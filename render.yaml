# Despliegue en Render: https://render.com/deploy
# Configuración usada en el evento: plan Starter (no se duerme) + disco persistente (las fotos sobreviven a reinicios).
# Para volver al plan gratuito: plan: free, quita el bloque disk y la variable DATA_DIR (y guarda antes las fotos).
services:
  - type: web
    name: muro-interactivo
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/info
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PIN
        sync: false        # Render te lo pide al desplegar
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
