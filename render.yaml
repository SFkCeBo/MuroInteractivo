# Despliegue en Render: https://render.com/deploy
# Plan gratuito: se duerme tras 15 min sin uso y las fotos se borran al reiniciar.
# Para un evento: plan: starter y añade un disco (descomenta el bloque disk y DATA_DIR).
services:
  - type: web
    name: muro-interactivo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/info
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: ADMIN_PIN
        sync: false        # Render te lo pide al desplegar
      - key: NODE_VERSION
        value: "22"
      # - key: DATA_DIR
      #   value: /var/data
